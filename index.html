<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aditech Receipt: Create. Customize. Print.</title>
    <meta name="description" content="Create, customize and print professional receipts with your own logo and business details. Built for shops, supermarkets, pharmacies and more." />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Favicon: SVG for modern browsers, PNG/ICO fallback for the rest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Link previews (WhatsApp, Facebook, iMessage, Slack, etc.).
      og:url and og:image use a placeholder domain — once this is deployed
      (e.g. with `firebase deploy`), replace YOUR-DOMAIN below with the real
      address so previews link back to the live site correctly.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aditech Receipt" />
    <meta property="og:title" content="Aditech Receipt: Create. Customize. Print." />
    <meta property="og:description" content="Create, customize and print professional receipts with your own logo and business details. Built for shops, supermarkets, pharmacies and more." />
    <meta property="og:image" content="https://YOUR-DOMAIN/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://YOUR-DOMAIN/" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditech Receipt: Create. Customize. Print." />
    <meta name="twitter:description" content="Create, customize and print professional receipts with your own logo and business details." />
    <meta name="twitter:image" content="https://YOUR-DOMAIN/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
